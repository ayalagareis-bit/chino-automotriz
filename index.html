<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chino automotriz — 42 caracteres</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;color:#17202a;margin:0;padding:20px;text-align:center}main{max-width:540px;margin:auto}select,button{font-size:17px;padding:13px;border-radius:12px;border:1px solid #c5cfda}select{width:100%;background:white}#card{background:white;border-radius:22px;min-height:270px;margin-top:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:0 5px 22px #0002}#symbol{font-size:105px}#meaning{font-size:24px;font-weight:bold;min-height:35px}button{border:0;cursor:pointer}#reveal{background:#243c65;color:white;width:100%;margin-top:14px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}#wrong{background:#ffd8d8}#right{background:#c8f0d7}#next{background:#dce5f6;width:100%;margin-top:12px}#stats{margin-top:14px;color:#596579}footer{margin-top:20px}</style></head><body><main><h2>Chino automotriz</h2><p>Caracteres individuales · 42 tarjetas</p><label for="group">Grupo de práctica</label><select id="group"><option value="latest">12 nuevos</option><option value="previous">8 anteriores</option><option value="new">10 anteriores</option><option value="old">12 originales</option><option value="all">Todos (42)</option></select><div id="stats"></div><div id="card"><div id="symbol"></div><div id="meaning"></div><small id="hint">Tocá para descubrir</small></div><button id="reveal">Ver significado</button><div class="actions"><button id="wrong">No lo sé</button><button id="right">Lo sé</button></div><button id="next">Otra tarjeta ↻</button><footer><a href="palabras-combinadas.html">Ir a palabras combinadas</a></footer></main><script>
const cards=[
["车","Vehículo / auto","old"],["电","Electricidad","old"],["油","Aceite / combustible","old"],["机","Máquina","old"],["气","Aire / gas","old"],["水","Agua","old"],["火","Fuego","old"],["大","Grande","old"],["小","Chico / pequeño","old"],["力","Fuerza","old"],["动","Mover / movimiento","old"],["发","Iniciar / generar","old"],
["轮","Rueda","new"],["轴","Eje / árbol","new"],["速","Velocidad","new"],["压","Presión","new"],["温","Temperatura","new"],["热","Calor / caliente","new"],["冷","Frío","new"],["制","Controlar / regular","new"],["刹","Frenar","new"],["传","Transmitir","new"],
["门","Puerta","previous"],["灯","Luz / lámpara","previous"],["开","Abrir / encender","previous"],["关","Cerrar / apagar","previous"],["高","Alto","previous"],["低","Bajo","previous"],["前","Delantero","previous"],["后","Trasero","previous"],
["池","Depósito / estanque","latest"],["路","Camino / vía","latest"],["流","Flujo / corriente","latest"],["转","Girar / rotar","latest"],["向","Dirección / orientación","latest"],["离","Separar","latest"],["合","Unir / acoplar","latest"],["器","Dispositivo / aparato","latest"],["排","Expulsar / descargar","latest"],["进","Entrar / ingresar","latest"],["故","Incidente / causa","latest"],["障","Obstáculo / impedimento","latest"]];
let group='latest',current=-1,seen=0,correct=0,shown=false;const weights=cards.map(()=>3),$=id=>document.getElementById(id);function active(){return cards.map((c,i)=>i).filter(i=>group==='all'||cards[i][2]===group)}function stats(){$('stats').textContent=`Tarjetas: ${active().length} · Practicadas: ${seen} · Correctas: ${correct}`}function nextCard(){const ids=active(),pool=[];ids.forEach(i=>{if(i!==current)for(let j=0;j<weights[i];j++)pool.push(i)});if(!pool.length)pool.push(...ids);current=pool[Math.floor(Math.random()*pool.length)];shown=false;$('symbol').textContent=cards[current][0];$('meaning').textContent='';$('hint').textContent='Tocá para descubrir';stats()}function reveal(){shown=true;$('meaning').textContent=cards[current][1];$('hint').textContent=''}function answer(known){if(!shown){reveal();return}seen++;if(known)correct++;weights[current]=known?1:6;nextCard()}$('group').onchange=e=>{group=e.target.value;current=-1;seen=0;correct=0;nextCard()};$('card').onclick=reveal;$('reveal').onclick=reveal;$('wrong').onclick=()=>answer(false);$('right').onclick=()=>answer(true);$('next').onclick=nextCard;nextCard();
</script></body></html>
