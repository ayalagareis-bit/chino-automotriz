<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chino automotriz</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,Arial,sans-serif;background:#eef1f5;margin:0;padding:20px;text-align:center;color:#17202a}
h2{margin:14px 0 8px}
#stats{color:#596579;margin:14px 0}
#card{background:white;border-radius:22px;min-height:290px;padding:30px 15px;box-shadow:0 5px 22px #0002;display:flex;flex-direction:column;justify-content:center;user-select:none;touch-action:pan-y}
#symbol{font-size:110px;font-weight:500;line-height:1.4}
#meaning{font-size:25px;margin-top:20px;font-weight:bold;min-height:34px}
.hint{color:#798391;font-size:14px}
button{border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:600;cursor:pointer}
#reveal{background:#243c65;color:white;width:100%;margin-top:18px}
.actions{display:flex;gap:12px;margin-top:12px}.actions button{flex:1}
#wrong{background:#ffd8d8}#right{background:#c8f0d7}
#next{background:#dce5f6;width:100%;margin-top:12px}
select{font-size:17px;padding:10px;border:1px solid #bdc8d8;border-radius:10px;background:white;max-width:100%}
</style>
</head>
<body>
<h2>Chino automotriz</h2>
<label for="group">Grupo de tarjetas: </label>
<select id="group" onchange="changeGroup()">
<option value="new">10 nuevas</option>
<option value="old">12 originales</option>
<option value="all">Todas (22)</option>
</select>
<div id="stats"></div>
<div id="card" onclick="reveal()">
<div id="symbol"></div><div id="meaning"></div>
<div class="hint" id="hint">Tocá para descubrir</div>
</div>
<button id="reveal" onclick="reveal()">Ver significado</button>
<div class="actions">
<button id="wrong" onclick="answer(false)">No lo sé</button>
<button id="right" onclick="answer(true)">Lo sé</button>
</div>
<button id="next" onclick="nextCard()">Otra tarjeta ↻</button>
<script>
const cards=[
["车","Vehículo / auto"],
["电","Electricidad"],
["油","Aceite / combustible"],
["机","Máquina"],
["气","Aire / gas"],
["水","Agua"],
["火","Fuego"],
["大","Grande"],
["小","Chico / pequeño"],
["力","Fuerza"],
["动","Mover / movimiento"],
["发","Iniciar / generar"],
["轮","Rueda"],
["轴","Eje / árbol"],
["速","Velocidad"],
["压","Presión"],
["温","Temperatura"],
["热","Calor / caliente"],
["冷","Frío"],
["制","Controlar / regular"],
["刹","Frenar"],
["传","Transmitir"]
];
let weights=cards.map(()=>3),group="new",current=-1,seen=0,correct=0,shown=false;
function activeIndices(){return cards.map((_,i)=>i).filter(i=>group==="all"||(group==="old"?i<12:i>=12));}
function changeGroup(){group=document.getElementById("group").value;current=-1;seen=0;correct=0;nextCard();}
function nextCard(){
const pool=[];
activeIndices().forEach(i=>{if(i!==current)for(let j=0;j<weights[i];j++)pool.push(i);});
current=pool[Math.floor(Math.random()*pool.length)];
shown=false;
document.getElementById("symbol").textContent=cards[current][0];
document.getElementById("meaning").textContent="";
document.getElementById("hint").textContent="Tocá para descubrir";
updateStats();
}
function reveal(){shown=true;document.getElementById("meaning").textContent=cards[current][1];document.getElementById("hint").textContent="";}
function answer(known){if(!shown){reveal();return;}seen++;if(known)correct++;weights[current]=known?1:6;nextCard();}
function updateStats(){document.getElementById("stats").textContent="Tarjetas: "+activeIndices().length+" | Practicadas: "+seen+" | Correctas: "+correct;}
let startX=0;
const card=document.getElementById("card");
card.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
card.addEventListener("touchend",e=>{if(Math.abs(e.changedTouches[0].screenX-startX)>70)nextCard();},{passive:true});
nextCard();
</script>
</body>
</html>
