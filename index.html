<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chino automotriz — 92 tarjetas</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;color:#17202a;margin:0;padding:20px;text-align:center}main{max-width:540px;margin:auto}h1{font-size:25px}p{color:#596579}label{display:block;margin:12px}select{width:100%;font-size:17px;padding:13px;background:#fff;border:1px solid #c5cfda;border-radius:12px}#stats{color:#596579;margin:15px}#card{background:white;border-radius:22px;min-height:290px;padding:25px;box-shadow:0 5px 22px #0002;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;touch-action:pan-y}#symbol{font-size:clamp(60px,15vw,100px);overflow-wrap:anywhere}#meaning{font-size:24px;font-weight:bold;margin-top:16px;min-height:34px}#hint{color:#798391;margin-top:10px}button{border:0;border-radius:12px;padding:16px;font-size:17px;cursor:pointer}#reveal{background:#243c65;color:white;width:100%;margin-top:15px}.actions{display:flex;gap:12px;margin-top:12px}.actions button{flex:1}#wrong{background:#ffd8d8}#right{background:#c8f0d7}#next{background:#dce5f6;width:100%;margin-top:12px}#repeat{background:#edf0f5;width:100%;margin-top:12px}footer{margin-top:20px}a{color:#243c65}</style></head><body><main><h1>Chino automotriz</h1><p>Caracteres individuales · 92 tarjetas</p><label for="group">Grupo de práctica</label><select id="group"><option value="new92">10 nuevos · motor</option><option value="new82">10 anteriores · diagnóstico</option><option value="today">10 anteriores · electricidad</option><option value="batch1">10 anteriores · grupo 1</option><option value="batch2">10 anteriores · grupo 2</option><option value="latest">12 anteriores</option><option value="previous">8 anteriores</option><option value="new">10 anteriores</option><option value="old">12 originales</option><option value="all">Todos (92)</option></select><div id="stats" aria-live="polite"></div><div id="card" role="button" tabindex="0"><div id="symbol"></div><div id="meaning"></div><small id="hint">Tocá para descubrir</small></div><button id="reveal">Ver significado</button><div class="actions"><button id="wrong">No lo sé</button><button id="right">Lo sé</button></div><button id="repeat">🔊 Repetir pronunciación</button><button id="next">Otra tarjeta ↻</button><footer><a href="palabras-combinadas.html">Ir a palabras combinadas</a></footer></main><script>const cards=[["车", "Vehículo / auto", "old"], ["电", "Electricidad", "old"], ["油", "Aceite / combustible", "old"], ["机", "Máquina", "old"], ["气", "Aire / gas", "old"], ["水", "Agua", "old"], ["火", "Fuego", "old"], ["大", "Grande", "old"], ["小", "Chico / pequeño", "old"], ["力", "Fuerza", "old"], ["动", "Mover / movimiento", "old"], ["发", "Iniciar / generar", "old"], ["轮", "Rueda", "new"], ["轴", "Eje / árbol", "new"], ["速", "Velocidad", "new"], ["压", "Presión", "new"], ["温", "Temperatura", "new"], ["热", "Calor / caliente", "new"], ["冷", "Frío", "new"], ["制", "Controlar / regular", "new"], ["刹", "Frenar", "new"], ["传", "Transmitir", "new"], ["门", "Puerta", "previous"], ["灯", "Luz / lámpara", "previous"], ["开", "Abrir / encender", "previous"], ["关", "Cerrar / apagar", "previous"], ["高", "Alto", "previous"], ["低", "Bajo", "previous"], ["前", "Delantero", "previous"], ["后", "Trasero", "previous"], ["池", "Depósito / estanque", "latest"], ["路", "Camino / vía", "latest"], ["流", "Flujo / corriente", "latest"], ["转", "Girar / rotar", "latest"], ["向", "Dirección / orientación", "latest"], ["离", "Separar", "latest"], ["合", "Unir / acoplar", "latest"], ["器", "Dispositivo / aparato", "latest"], ["排", "Expulsar / descargar", "latest"], ["进", "Entrar / ingresar", "latest"], ["故", "Incidente / causa", "latest"], ["障", "Obstáculo / impedimento", "latest"], ["保", "Proteger / asegurar", "batch1"], ["险", "Riesgo / peligro", "batch1"], ["丝", "Hilo / filamento", "batch1"], ["继", "Continuar / suceder", "batch1"], ["控", "Controlar", "batch1"], ["散", "Dispersar / disipar", "batch1"], ["燃", "Quemar / combustión", "batch1"], ["泵", "Bomba", "batch1"], ["花", "Flor / chispa (en bujía)", "batch1"], ["塞", "Tapón / obturar", "batch1"], ["空", "Vacío / aire", "batch2"], ["滤", "Filtrar", "batch2"], ["清", "Limpiar / puro", "batch2"], ["液", "Líquido", "batch2"], ["变", "Cambiar / transformar", "batch2"], ["箱", "Caja / compartimiento", "batch2"], ["感", "Percibir / sentir", "batch2"], ["测", "Medir / probar", "batch2"], ["信", "Señal / mensaje", "batch2"], ["号", "Número / señal", "batch2"], ["线", "Cable / línea", "today"], ["接", "Conectar / unir", "today"], ["地", "Tierra / masa", "today"], ["断", "Cortar / interrumpir", "today"], ["短", "Corto / breve", "today"], ["充", "Cargar", "today"], ["放", "Descargar / liberar", "today"], ["阀", "Válvula", "today"], ["扭", "Torcer / torsión", "today"], ["矩", "Momento", "today"], ["诊", "Diagnosticar", "new82"], ["检", "Inspeccionar", "new82"], ["查", "Revisar / comprobar", "new82"], ["修", "Reparar", "new82"], ["换", "Sustituir / cambiar", "new82"], ["读", "Leer", "new82"], ["码", "Código", "new82"], ["数", "Número / dato", "new82"], ["据", "Dato / información", "new82"], ["表", "Indicador / instrumento", "new82"], ["凸", "Saliente / convexo", "new92"], ["曲", "Curvo / doblado", "new92"], ["缸", "Cilindro (motor)", "new92"], ["盖", "Tapa / cubierta", "new92"], ["活", "Activo / móvil", "new92"], ["连", "Unir / conectar", "new92"], ["杆", "Barra / varilla", "new92"], ["拧", "Girar / enroscar", "new92"], ["紧", "Apretado / firme", "new92"], ["隙", "Separación / holgura", "new92"]];let group="new92",current=-1,seen=0,correct=0,busy=false;const weights=cards.map(()=>3),$=id=>document.getElementById(id);function active(){return cards.map((c,i)=>i).filter(i=>group==='all'||cards[i][2]===group)}function stats(){$('stats').textContent=`Tarjetas: ${active().length} · Practicadas: ${seen} · Correctas: ${correct}`}function nextCard(){const ids=active(),pool=[];ids.forEach(i=>{if(i!==current)for(let j=0;j<weights[i];j++)pool.push(i)});if(!pool.length)pool.push(...ids);current=pool[Math.floor(Math.random()*pool.length)];$('symbol').textContent=cards[current][0];$('meaning').textContent='';$('hint').textContent='Tocá para descubrir';stats()}function reveal(){if(current<0)return;$('meaning').textContent=cards[current][1];$('hint').textContent=''}function speak(done){if(!('speechSynthesis' in window)){if(done)done();return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[current][0]);u.lang='zh-CN';u.rate=.82;let finished=false;function finish(){if(finished)return;finished=true;if(done)done()}u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);if(done)setTimeout(finish,3500)}catch(e){if(done)done()}}function answer(known){if(busy||current<0)return;reveal();seen++;if(known)correct++;weights[current]=known?1:6;stats();busy=true;speak(()=>{busy=false;nextCard()})}function repeat(){if(current>=0)speak()}$('group').onchange=e=>{if('speechSynthesis' in window)speechSynthesis.cancel();busy=false;group=e.target.value;current=-1;seen=0;correct=0;nextCard()};$('card').onclick=reveal;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}};$('reveal').onclick=reveal;$('wrong').onclick=()=>answer(false);$('right').onclick=()=>answer(true);$('repeat').onclick=repeat;$('next').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();busy=false;nextCard()};nextCard();</script></body></html>
