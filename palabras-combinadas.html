<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chino automotriz — 172 tarjetas</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;color:#17202a;margin:0;padding:20px;text-align:center}main{max-width:540px;margin:auto}h1{font-size:25px}p{color:#596579}label{display:block;margin:12px}select{width:100%;font-size:17px;padding:13px;background:#fff;border:1px solid #c5cfda;border-radius:12px}#stats{color:#596579;margin:15px}#card{background:white;border-radius:22px;min-height:290px;padding:25px;box-shadow:0 5px 22px #0002;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;touch-action:pan-y}#symbol{font-size:clamp(60px,15vw,100px);overflow-wrap:anywhere}#meaning{font-size:24px;font-weight:bold;margin-top:16px;min-height:34px}#hint{color:#798391;margin-top:10px}button{border:0;border-radius:12px;padding:16px;font-size:17px;cursor:pointer}#reveal{background:#243c65;color:white;width:100%;margin-top:15px}.actions{display:flex;gap:12px;margin-top:12px}.actions button{flex:1}#wrong{background:#ffd8d8}#right{background:#c8f0d7}#next{background:#dce5f6;width:100%;margin-top:12px}#repeat{background:#edf0f5;width:100%;margin-top:12px}footer{margin-top:20px}a{color:#243c65}</style></head><body><main><h1>Chino automotriz</h1><p>Palabras combinadas · 172 tarjetas</p><label for="group">Grupo de práctica</label><select id="group"><option value="new172">Nuevas 10/11 — Electricidad y arranque</option><option value="new152">20 nuevas · sistemas del motor</option><option value="new132">20 nuevas · mecánica</option><option value="new112">20 anteriores · diagnóstico</option><option value="electric">12 anteriores · electricidad</option><option value="mechanic">8 anteriores · mecánica</option><option value="diagnostic">10 anteriores · diagnóstico</option><option value="latest">10 anteriores</option><option value="recent">10 de sesión anterior</option><option value="previous">18 anteriores</option><option value="review">14 de repaso inicial</option><option value="extra">10 adicionales</option><option value="all">Todas (152)</option></select><div id="stats" aria-live="polite"></div><div id="card" role="button" tabindex="0"><div id="symbol"></div><div id="meaning"></div><small id="hint">Tocá para descubrir</small></div><button id="reveal">Ver significado</button><div class="actions"><button id="wrong">No lo sé</button><button id="right">Lo sé</button></div><button id="repeat">🔊 Escuchar pronunciación</button><button id="next">Otra tarjeta ↻</button><footer><a href="index.html">Ir a caracteres individuales</a></footer></main><script>const cards=[["车轮","Rueda del vehículo","review"],["车速","Velocidad del vehículo","review"],["油压","Presión de aceite","review"],["油温","Temperatura del aceite","review"],["水温","Temperatura del agua / refrigerante","review"],["冷水","Agua fría","review"],["热水","Agua caliente","review"],["制动","Frenado","review"],["刹车","Freno / frenar","review"],["传动","Transmisión de movimiento","review"],["传动轴","Árbol de transmisión / cardán","review"],["发动机","Motor del vehículo","review"],["高油压","Presión de aceite elevada","review"],["冷却","Enfriamiento / refrigeración","review"],["电机","Motor eléctrico","extra"],["电动车","Vehículo eléctrico","extra"],["高速","Alta velocidad","extra"],["低速","Baja velocidad","extra"],["气压","Presión del aire / gas","extra"],["水压","Presión del agua","extra"],["压力","Presión / fuerza aplicada","extra"],["大车","Vehículo grande","extra"],["小车","Vehículo pequeño","extra"],["起动机","Motor de arranque (burro)","extra"],["车门","Puerta del vehículo","previous"],["前门","Puerta delantera","previous"],["后门","Puerta trasera","previous"],["车灯","Luces del vehículo","previous"],["前灯","Luz delantera","previous"],["后灯","Luz trasera","previous"],["开门","Abrir la puerta","previous"],["关门","Cerrar la puerta","previous"],["开机","Encender un equipo","previous"],["关机","Apagar M","diagnostic"],["电流传感器","Sensor de corriente","diagnostic"],["电压传感器","Sensor de tensión","diagnostic"],["故障信号","Señal de falla","diagnostic"],["控制信号","Señal de control","diagnostic"],["电路故障","Falla del circuito","diagnostic"],["充电电路","Circuito de carga","diagnostic"],["诊断","Diagnóstico","new112"],["检查","Inspección / comprobación","new112"],["检测","Detección / prueba","new112"],["修车","Reparar el vehículo","new112"],["换油","Cambio de aceite","new112"],["读码","Leer códigos","new112"],["故障码","Código de avería","new112"],["故障诊断","Diagnóstico de fallas","new112"],["数据","Datos","new112"],["数据流","Flujo de datos","new112"],["电压表","Voltímetro","new112"],["转速表","Tacómetro","new112"],["压力表","Manómetro","new112"],["电流表","Amperímetro","new112"],["检查电路","Revisar el circuito eléctrico","new112"],["检查电压","Comprobar la tensión eléctrica","new112"],["检查油压","Comprobar la presión de aceite","new112"],["检查水温","Comprobar la temperatura del refrigerante","new112"],["检查传感器","Revisar el sensor","new112"],["检查保险丝","Revisar el fusible","new112"],["凸轮轴","Árbol de levas","new132"],["曲轴","Cigüeñal","new132"],["气缸","Cilindro del motor","new132"],["气缸盖","Tapa de cilindros / culata","new132"],["活塞","Pistón","new132"],["连杆","Biela","new132"],["拧紧","Apretar firmemente","new132"],["拧紧扭矩","Par de apriete","new132"],["曲轴转速","RPM del cigüeñal","new132"],["凸轮轴转速","RPM del árbol de levas","new132"],["气缸压力","Presión del cilindro","new132"],["气缸压力表","Manómetro de cilindro","new132"],["检查曲轴","Inspeccionar el cigüeñal","new132"],["检查凸轮轴","Inspeccionar el árbol de levas","new132"],["检查活塞","Inspeccionar el pistón","new132"],["检查连杆","Inspeccionar la biela","new132"],["检查气缸","Inspeccionar el cilindro","new132"],["检查气缸盖","Inspeccionar la tapa de cilindros","new132"],["气缸故障","Falla del cilindro","new132"],["活塞故障","Falla del pistón","new132"],["润滑","Lubricación","new152"],["润滑系统","Sistema de lubricación","new152"],["冷却系统","Sistema de refrigeración","new152"],["燃油喷射","Inyección de combustible","new152"],["喷射","Inyección / pulverización","new152"],["怠速","Ralentí","new152"],["正时","Puesta a punto / sincronización","new152"],["正时链","Cadena de distribución (forma abreviada)","new152"],["正时系统","Sistema de distribución / sincronización","new152"],["喷油","Inyectar combustible","new152"],["喷油器","Inyector de combustible","new152"],["燃油系统","Sistema de combustible","new152"],["发动机润滑","Lubricación del motor","new152"],["发动机冷却","Refrigeración del motor","new152"],["润滑油","Aceite lubricante","new152"],["润滑油压","Presión del aceite lubricante","new152"],["检查润滑系统","Revisar el sistema de lubricación","new152"],["检查冷却系统","Revisar el sistema de refrigeración","new152"],["检查喷油器","Revisar el inyector","new152"],["正时故障","Falla de sincronización","new152"],["启动","Arranque / poner en marcha","new172"],["启动系统","Sistema de arranque","new172"],["启动机","Motor de arranque","new172"],["蓄电池","Batería de acumuladores","new172"],["蓄电池电压","Tensión de la batería","new172"],["正极","Polo positivo","new172"],["负极","Polo negativo","new172"],["电池端子","Terminal de batería","new172"],["线束","Mazo de cables","new172"],["发动机线束","Mazo de cables del motor","new172"],["接触","Contacto eléctrico","new172"],["接触不良","Mal contacto eléctrico","new172"],["触点","Punto de contacto eléctrico","new172"],["继电器触点","Contactos del relé","new172"],["熔断器","Fusible","new172"],["熔断","Fusión o interrupción por sobrecorriente","new172"],["电阻","Resistencia eléctrica","new172"],["绝缘电阻","Resistencia de aislamiento","new172"],["测量","Medición / medir","new172"],["测量电压","Medir la tensión eléctrica","new172"]];
let group="new172",current=-1,seen=0,correct=0,answered=false;
const weights=cards.map(()=>3),$=id=>document.getElementById(id);
function active(){return cards.map((c,i)=>i).filter(i=>group==='all'||cards[i][2]===group)}
function stats(){$('stats').textContent=`Tarjetas: ${active().length} · Practicadas: ${seen} · Correctas: ${correct}`}
function nextCard(){
  const ids=active(),pool=[];
  ids.forEach(i=>{if(i!==current)for(let j=0;j<weights[i];j++)pool.push(i)});
  if(!pool.length)pool.push(...ids);
  current=pool[Math.floor(Math.random()*pool.length)];
  answered=false;
  $('symbol').textContent=cards[current][0];
  $('meaning').textContent='';
  $('hint').textContent='Tocá para descubrir';
  stats();
}
function reveal(){
  if(current<0)return;
  $('meaning').textContent=cards[current][1];
  $('hint').textContent='';
}
let chineseVoice=null;
function selectVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=window.speechSynthesis.getVoices();
  chineseVoice=voices.find(v=>/^zh[-_]CN/i.test(v.lang))
    ||voices.find(v=>/^zh/i.test(v.lang))||null;
}
if('speechSynthesis' in window){
  selectVoice();
  window.speechSynthesis.addEventListener('voiceschanged',selectVoice);
}
function speak(){
  if(current<0)return;
  if(!('speechSynthesis' in window)){
    $('hint').textContent='Este navegador no admite pronunciación';
    return;
  }
  try{
    selectVoice();
    // Ejecutar directamente dentro del toque del usuario: Safari iOS
    // puede bloquear la síntesis iniciada por callbacks diferidos.
    const u=new SpeechSynthesisUtterance(cards[current][0]);
    u.lang='zh-CN';
    u.rate=0.85;
    u.volume=1;
    if(chineseVoice)u.voice=chineseVoice;
    u.onerror=()=>{$('hint').textContent='No se pudo reproducir. Revisá las voces chinas del iPhone.'};
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){
    $('hint').textContent='No se pudo iniciar la pronunciación';
  }
}
function answer(known){
  if(current<0)return;
  if(answered){nextCard();return}
  reveal();
  seen++;
  if(known)correct++;
  weights[current]=known?1:6;
  answered=true;
  stats();
  speak();
  $('hint').textContent='Tocá «Otra tarjeta» para continuar';
}
$('group').onchange=e=>{
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  group=e.target.value;current=-1;seen=0;correct=0;nextCard();
};
$('card').onclick=reveal;
$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}};
$('reveal').onclick=reveal;
$('wrong').onclick=()=>answer(false);
$('right').onclick=()=>answer(true);
$('repeat').onclick=()=>{reveal();speak()};
$('next').onclick=()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();nextCard()};
nextCard();
</script></body></html>
